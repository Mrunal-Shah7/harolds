# SPRINT-2 / SPRINT-3: Harold's Chicken Oak Lawn — public Menu + Store Status + Quote API (v1)
# Contract version 1.2.0 — additive extension of frozen 1.0.0 (quote endpoint + validation reasons).
openapi: 3.0.3
info:
  title: Harold's Chicken Oak Lawn — Public API
  version: "1.2.0"
  description: |
    Public API for the Harold's Chicken Oak Lawn online ordering storefront.

    ## Contract versions

    - **1.0.0** (Sprint 2): menu + store status reads — frozen; no renames/removals.
    - **1.1.0** (Sprint 3):
    - **1.2.0** (Sprint 4): additive — orders, payment, webhooks, health additive — `POST /api/v1/quote` (stateless pricing) and cart validation
      reason codes. Nothing from 1.0.0 was renamed or removed.

    After each freeze, changes are **additive only**. Renames and removals are not permitted
    without an explicit version bump agreed in advance.

    ## Scope (v1)

    Pickup only, guest checkout only, ASAP orders only. Checkout / order placement arrive
    in Sprint 4 and are **not** part of this document yet.

    ## Response envelope

    Success responses:

    ```json
    { "data": <payload>, "meta": { "serverTime": "<ISO UTC>", "version": "1.1.0" } }
    ```

    Failure responses:

    ```json
    {
      "error": { "code": "<ApiErrorCode>", "message": "<string>", "details": null },
      "meta": { "serverTime": "<ISO UTC>", "version": "1.1.0" }
    }
    ```

    Quote validation failures put a `reasons` array in `error.details`.

    ## Serialisation rules

    - Money is an **integer number of US cents**, never a string, never a float. Money field
      names end in `Cents` (for example `basePriceCents`, `priceDeltaCents`).
    - **The client never sends a price.** Cart requests carry identifiers and quantities only.
      Every price is resolved server-side. A request body containing any price-like field is
      rejected with `VALIDATION_ERROR` / `PRICE_FIELD_FORBIDDEN`.
    - Timestamps are ISO 8601 strings in **UTC** with an explicit zone designator
      (for example `2026-08-09T17:00:00.000Z`).
    - Wall-clock store hours (`openTime` / `closeTime`) are strings in 24-hour `HH:mm` form.
      They are **not** timestamps — they carry no date and no zone, and are interpreted against
      the store's configured `timezone` (America/Chicago).
    - Dates without times (`closures[].date`) are ISO calendar dates (`YYYY-MM-DD`).
    - Nullable fields are present with a `null` value rather than omitted.
    - Field names are camelCase throughout.

    ## Error codes

    | code | HTTP | meaning |
    |------|------|---------|
    | NOT_FOUND | 404 | Unknown path, or unknown menu item / slug pair |
    | VALIDATION_ERROR | 400 | Request failed validation (cart structure / modifiers / tip) |
    | STORE_CLOSED | 409 | Store is outside opening hours / closed for the day (also used in quote `blockingReasons`) |
    | STORE_NOT_ACCEPTING_ORDERS | 409 | Store is open but not accepting online orders |
    | ITEM_UNAVAILABLE | 409 | Requested item cannot be ordered (for example sold out) |
    | INTERNAL_ERROR | 500 | Unexpected server failure; details never leak to the client |

    ## Mock server triggers (development only)

    The fixture-backed mock (`pnpm mock`, port 4001) honours:

    - Query `?forceError=<ApiErrorCode>` or header `X-Mock-Error: <ApiErrorCode>`
    - Query `?forceStore=closed` → `isOpen=false` (store status and quote orderability)
    - Query `?forceStore=not-accepting` → `acceptingOrders=false` with a message
    - Query `?forceSoldOut=item|option` on `POST /api/v1/quote` → sold-out validation reasons

    The real application API does **not** honour these triggers.
  contact:
    name: Harold's engineering
servers:
  - url: http://localhost:3000
    description: Next.js application (real API + DB)
  - url: http://localhost:4001
    description: Fixture mock (@harolds/mock-api) — no database required

tags:
  - name: Menu
    description: Catalogue reads — categories, items, curated lists
  - name: Store
    description: Store identity, hours, open/closed, money and prep settings
  - name: Quote
    description: Stateless cart pricing (no persistence)
  - name: Orders
    description: Checkout and public order status
  - name: Webhooks
    description: Processor callbacks (Square only)

paths:
  /api/v1/menu:
    get:
      tags: [Menu]
      summary: Full menu catalogue
      description: |
        Returns every active category with nested active items and each item's bound
        modifier groups. No pagination (catalogue is under 100 items). Sold-out items and
        options are included with `isSoldOut: true`.
      operationId: getFullMenu
      parameters:
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
      responses:
        "200":
          description: Full menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullMenuSuccess"
              examples:
                seeded:
                  summary: Harold's seeded Whole Dinners excerpt
                  value:
                    data:
                      categories:
                        - id: cat_cuid_example
                          slug: whole-dinners
                          name: Whole Dinners
                          description: null
                          sortOrder: 1
                          items:
                            - id: itm_cuid_example
                              slug: 2-pc-whole-dinner
                              name: 2 PC Whole Dinner
                              description: null
                              basePriceCents: 879
                              imageUrl: null
                              isSoldOut: false
                              isFeatured: false
                              isMostOrdered: false
                              sortOrder: 1
                              modifierGroups: []
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.0.0"
          headers:
            ETag:
              schema: { type: string }
              description: Entity tag derived from max menu-related updatedAt (real API)
            Cache-Control:
              schema: { type: string }
              description: "public, max-age=30, stale-while-revalidate=60 (real API)"
        "304":
          description: Not modified (If-None-Match matched ETag) — real API only
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/menu/categories:
    get:
      tags: [Menu]
      summary: Category summaries
      description: Active categories without nested items, including active item counts.
      operationId: getMenuCategories
      parameters:
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesSuccess"
              examples:
                seeded:
                  value:
                    data:
                      categories:
                        - id: cat_cuid_example
                          slug: whole-dinners
                          name: Whole Dinners
                          description: null
                          sortOrder: 1
                          activeItemCount: 5
                        - id: cat_cuid_chicken
                          slug: chicken-dinners
                          name: Chicken Dinners
                          description: null
                          sortOrder: 2
                          activeItemCount: 6
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.0.0"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/menu/items/{id}:
    get:
      tags: [Menu]
      summary: Menu item by id
      operationId: getMenuItemById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Menu item cuid
          example: cmsl1w65q0016ur9w72xcttlp
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
      responses:
        "200":
          description: Item detail with modifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemDetailSuccess"
              examples:
                chickenDinner:
                  summary: 1/2 Chicken Dinner with toppings + prep
                  value:
                    data:
                      id: itm_cuid_half
                      slug: 1-2-chicken-dinner
                      name: 1/2 Chicken Dinner
                      description: null
                      basePriceCents: 1149
                      imageUrl: null
                      isSoldOut: false
                      isFeatured: false
                      isMostOrdered: false
                      sortOrder: 2
                      categoryId: cat_cuid_chicken
                      categorySlug: chicken-dinners
                      modifierGroups:
                        - id: mg_cuid_toppings
                          prompt: Choose your topping
                          isRequired: false
                          minSelect: 0
                          maxSelect: 3
                          sortOrder: 1
                          options:
                            - id: mo_cuid_hot
                              name: Hot Sauce
                              priceDeltaCents: 0
                              isSoldOut: false
                              isDefaultSelected: false
                              sortOrder: 1
                        - id: mg_cuid_prep
                          prompt: How would you like it cooked?
                          isRequired: true
                          minSelect: 1
                          maxSelect: 1
                          sortOrder: 2
                          options:
                            - id: mo_cuid_fried_hard
                              name: Fried Hard
                              priceDeltaCents: 0
                              isSoldOut: false
                              isDefaultSelected: false
                              sortOrder: 1
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.0.0"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/menu/categories/{categorySlug}/items/{itemSlug}:
    get:
      tags: [Menu]
      summary: Menu item by category + item slugs
      operationId: getMenuItemBySlugs
      parameters:
        - name: categorySlug
          in: path
          required: true
          schema: { type: string }
          example: whole-dinners
        - name: itemSlug
          in: path
          required: true
          schema: { type: string }
          example: 2-pc-whole-dinner
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
      responses:
        "200":
          description: Item detail with modifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItemDetailSuccess"
              examples:
                wholeDinner:
                  value:
                    data:
                      id: itm_cuid_whole_2pc
                      slug: 2-pc-whole-dinner
                      name: 2 PC Whole Dinner
                      description: null
                      basePriceCents: 879
                      imageUrl: null
                      isSoldOut: false
                      isFeatured: false
                      isMostOrdered: false
                      sortOrder: 1
                      categoryId: cat_cuid_whole
                      categorySlug: whole-dinners
                      modifierGroups: []
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.0.0"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/menu/featured:
    get:
      tags: [Menu]
      summary: Curated featured items
      description: May be an empty list when no items are flagged featured.
      operationId: getFeaturedItems
      parameters:
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
      responses:
        "200":
          description: Featured item summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedItemsSuccess"
              examples:
                emptySeed:
                  summary: Seed currently has no featured flags
                  value:
                    data: { items: [] }
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.0.0"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/menu/most-ordered:
    get:
      tags: [Menu]
      summary: Curated most-ordered items
      description: May be an empty list when no items are flagged most-ordered.
      operationId: getMostOrderedItems
      parameters:
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
      responses:
        "200":
          description: Most-ordered item summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuratedItemsSuccess"
              examples:
                emptySeed:
                  value:
                    data: { items: [] }
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.0.0"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/store/status:
    get:
      tags: [Store]
      summary: Store status
      description: |
        Identity, weekly hours, closures, open/closed evaluation, accepting-orders flag,
        prep estimate, tax, and tip presets. Always read through StoreConfig at runtime —
        never hard-coded in route handlers.
      operationId: getStoreStatus
      parameters:
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
        - name: forceStore
          in: query
          required: false
          description: Mock only — force closed or not-accepting edge states
          schema:
            type: string
            enum: [closed, not-accepting]
      responses:
        "200":
          description: Current store status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatusSuccess"
              examples:
                oakLawn:
                  summary: Harold's Chicken Oak Lawn (seeded)
                  value:
                    data:
                      storeName: Harold's Chicken Oak Lawn
                      addressLine1: "4709 W 95th St"
                      addressLine2: null
                      city: Oak Lawn
                      state: IL
                      postalCode: "60453-2515"
                      contactPhone: "TODO: CONFIRM PHONE"
                      timezone: America/Chicago
                      hours:
                        - dayOfWeek: 0
                          openTime: "10:30"
                          closeTime: "23:00"
                          isClosed: false
                        - dayOfWeek: 1
                          openTime: "10:30"
                          closeTime: "23:00"
                          isClosed: false
                      closures: []
                      isOpen: true
                      nextOpenAt: null
                      acceptingOrders: true
                      notAcceptingMessage: null
                      prepMinutes: 20
                      estimatedReadyAt: "2026-08-09T17:20:00.000Z"
                      taxRateBps: 1010
                      taxAppliedPreDiscount: true
                      tippingEnabled: true
                      tipPresetsBps: [1500, 1800, 2000, 2500]
                      defaultTipPresetIndex: 1
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.2.0"
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store (real API)
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictErrors"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/quote:
    post:
      tags: [Quote]
      summary: Price a cart (stateless)
      description: |
        Accepts a cart of item identifiers, quantities, selected modifier option identifiers,
        and an optional tip. Returns a fully priced result with line snapshots, tax, tip,
        grand total, and an orderability verdict.

        This endpoint is a `POST` only because it carries a body. It is **stateless,
        idempotent, and free of side effects**: it writes nothing. Calling it a hundred times
        with the same body produces a hundred identically shaped priced responses and leaves
        no database row. It is **not** cart creation.

        Quotes are **advisory for display**. Sprint 4 recomputes prices authoritatively at
        checkout — the storefront must never send computed totals to the order endpoint.

        Caching is forbidden (`Cache-Control: no-store`). A cached quote is a customer charged
        yesterday's price.
      operationId: postQuote
      parameters:
        - $ref: "#/components/parameters/ForceError"
        - $ref: "#/components/parameters/MockErrorHeader"
        - name: forceStore
          in: query
          required: false
          description: Mock only — force closed / not-accepting on the orderability verdict
          schema:
            type: string
            enum: [closed, not-accepting]
        - name: forceSoldOut
          in: query
          required: false
          description: Mock only — force first line item or a fixture option sold out
          schema:
            type: string
            enum: [item, option]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartRequest"
            examples:
              realisticMultiLine:
                summary: Mayo ×2, PC Gizzards + fries, Pizza Puff + cheese, 18% tip preset
                value:
                  lines:
                    - itemId: cmsl1w68u004yur9walbqusod
                      quantity: 2
                      selectedOptionIds: []
                    - itemId: cmsl1w66t002cur9w5eh1hs4y
                      quantity: 1
                      selectedOptionIds: [cmsl1w65m0012ur9wk7phy3g0]
                      customerNote: Extra crispy if possible
                    - itemId: cmsl1w67m003eur9wfbdd256t
                      quantity: 1
                      selectedOptionIds: [cmsl1w65n0014ur9w081tyj87]
                  tip:
                    type: preset
                    presetIndex: 1
      responses:
        "200":
          description: Priced cart (may have orderable=false with blockingReasons)
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSuccess"
              examples:
                realisticMultiLine:
                  summary: Hand-checked totals — sub 2254 + tax 228 + tip 447 = 2929
                  value:
                    data:
                      lines:
                        - itemId: cmsl1w68u004yur9walbqusod
                          snapshot:
                            itemName: Mayo Packet
                            boardLabel: "MAYO PACKETS"
                            baseUnitPriceCents: 29
                            modifierTotalCents: 0
                            effectiveUnitPriceCents: 29
                            quantity: 2
                            lineTotalCents: 58
                            selectedModifiers: []
                            customerNote: null
                        - itemId: cmsl1w66t002cur9w5eh1hs4y
                          snapshot:
                            itemName: PC Gizzards
                            boardLabel: "PC GIZZARDS"
                            baseUnitPriceCents: 1279
                            modifierTotalCents: 449
                            effectiveUnitPriceCents: 1728
                            quantity: 1
                            lineTotalCents: 1728
                            selectedModifiers:
                              - groupName: Add ons
                                groupPrompt: Add ons
                                optionName: Add Fries
                                priceDeltaCents: 449
                            customerNote: Extra crispy if possible
                        - itemId: cmsl1w67m003eur9wfbdd256t
                          snapshot:
                            itemName: Pizza Puff
                            boardLabel: "PIZZA PUFF ONLY"
                            baseUnitPriceCents: 349
                            modifierTotalCents: 119
                            effectiveUnitPriceCents: 468
                            quantity: 1
                            lineTotalCents: 468
                            selectedModifiers:
                              - groupName: Add ons
                                groupPrompt: Add ons
                                optionName: Add Cheese
                                priceDeltaCents: 119
                            customerNote: null
                      subtotalCents: 2254
                      taxCents: 228
                      taxRateBps: 1010
                      taxAppliedPreDiscount: true
                      tip:
                        type: preset
                        presetIndex: 1
                        rateBps: 1800
                        tipCents: 447
                      totalCents: 2929
                      orderable: true
                      blockingReasons: []
                      estimatedReadyAt: "2026-08-09T17:20:00.000Z"
                    meta:
                      serverTime: "2026-08-09T17:00:00.000Z"
                      version: "1.2.0"
        "400":
          description: Structural or modifier validation failed — details.reasons lists every problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"


  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create order and take payment
      description: |
        Authoritatively prices the cart, creates a pending order, charges via Square, and on
        success allocates an order number. **Stateless cart — no prices from the client.**
        Client sends a Square Web Payments SDK token only — never card data.
        Idempotent on `idempotencyKey`.
      operationId: postOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              cart:
                lines:
                  - itemId: cmsl1w68u004yur9walbqusod
                    quantity: 2
                    selectedOptionIds: []
              customer:
                firstName: Casey
                lastName: Cook
                phone: "+17085550100"
                email: casey@example.com
                smsConsent: true
              paymentToken: cnon:card-nonce-ok
              idempotencyKey: checkout-attempt-001
      responses:
        '200':
          description: Order created / replayed
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment declined
        '409':
          $ref: '#/components/responses/ConflictErrors'
        '502':
          description: Payment failed / unknown

  /api/v1/orders/status/{lookupToken}:
    get:
      tags: [Orders]
      summary: Public order status by unguessable token
      description: Never look up by order number. Returns first name + money + lines only.
      operationId: getOrderStatus
      parameters:
        - name: lookupToken
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order status
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/square:
    post:
      tags: [Webhooks]
      summary: Square webhook receiver (NOT storefront)
      description: |
        Square only. Verifies HMAC signature over the raw body. Exactly-once by event id.
      operationId: postSquareWebhook
      responses:
        '200':
          description: Accepted
        '401':
          description: Invalid signature

  /api/v1/health:
    get:
      tags: [Store]
      summary: Health / Square environment selector
      operationId: getHealth
      responses:
        '200':
          description: |
            Process, database, and worker are up.
            `data.ok` is true. `data.squareEnvironment` is `sandbox` or `production`.
            Additive Sprint 9 fields: `data.checks.database`, `data.checks.worker`, `data.worker.lastPassAt`.
        '503':
          description: |
            Additive Sprint 9 — process is reachable but a dependency is down
            (`data.ok` false; `checks.database` or `checks.worker` not up). Same envelope as 200.



components:
  parameters:
    ForceError:
      name: forceError
      in: query
      required: false
      description: Mock only — force a specific error envelope
      schema:
        $ref: "#/components/schemas/ApiErrorCode"
    MockErrorHeader:
      name: X-Mock-Error
      in: header
      required: false
      description: Mock only — same effect as forceError
      schema:
        $ref: "#/components/schemas/ApiErrorCode"

  responses:
    NotFound:
      description: Resource or endpoint not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: Endpoint not found.
                  details: null
                meta:
                  serverTime: "2026-08-09T17:00:00.000Z"
                  version: "1.0.0"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed.
                  details: null
                meta:
                  serverTime: "2026-08-09T17:00:00.000Z"
                  version: "1.0.0"
    ConflictErrors:
      description: Business conflict (closed / not accepting / item unavailable)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            storeClosed:
              value:
                error:
                  code: STORE_CLOSED
                  message: The store is currently closed.
                  details: null
                meta:
                  serverTime: "2026-08-09T17:00:00.000Z"
                  version: "1.0.0"
            notAccepting:
              value:
                error:
                  code: STORE_NOT_ACCEPTING_ORDERS
                  message: The store is not accepting orders right now.
                  details: null
                meta:
                  serverTime: "2026-08-09T17:00:00.000Z"
                  version: "1.0.0"
            itemUnavailable:
              value:
                error:
                  code: ITEM_UNAVAILABLE
                  message: This item is unavailable.
                  details: null
                meta:
                  serverTime: "2026-08-09T17:00:00.000Z"
                  version: "1.0.0"
    InternalError:
      description: Unexpected failure (no internal detail in body)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: An unexpected error occurred.
                  details: null
                meta:
                  serverTime: "2026-08-09T17:00:00.000Z"
                  version: "1.0.0"

  schemas:
    ApiErrorCode:
      type: string
      enum:
        - NOT_FOUND
        - VALIDATION_ERROR
        - STORE_CLOSED
        - STORE_NOT_ACCEPTING_ORDERS
        - ITEM_UNAVAILABLE
        - INTERNAL_ERROR
        - PAYMENT_DECLINED
        - PAYMENT_FAILED
        - IDEMPOTENCY_CONFLICT
        - UNAUTHORIZED

    ResponseMeta:
      type: object
      required: [serverTime, version]
      additionalProperties: false
      properties:
        serverTime:
          type: string
          format: date-time
          description: Server UTC timestamp (ISO 8601 with zone)
        version:
          type: string
          example: "1.1.0"
          description: Contract version (currently 1.1.0)

    ApiErrorBody:
      type: object
      required: [code, message, details]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
        details:
          nullable: true
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MenuModifierOption:
      type: object
      required: [id, name, priceDeltaCents, isSoldOut, isDefaultSelected, sortOrder]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        priceDeltaCents:
          type: integer
          description: Price delta in US cents (may be 0; Add Fries is 449)
        isSoldOut: { type: boolean }
        isDefaultSelected: { type: boolean }
        sortOrder: { type: integer }

    MenuModifierGroup:
      type: object
      required: [id, prompt, isRequired, minSelect, maxSelect, sortOrder, options]
      additionalProperties: false
      properties:
        id: { type: string }
        prompt: { type: string }
        isRequired: { type: boolean }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        sortOrder: { type: integer }
        options:
          type: array
          items:
            $ref: "#/components/schemas/MenuModifierOption"

    MenuItemSummary:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - basePriceCents
        - imageUrl
        - isSoldOut
        - isFeatured
        - isMostOrdered
        - sortOrder
      additionalProperties: false
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string, example: 2 PC Whole Dinner }
        description: { type: string, nullable: true }
        basePriceCents: { type: integer, example: 879 }
        imageUrl: { type: string, nullable: true }
        isSoldOut: { type: boolean }
        isFeatured: { type: boolean }
        isMostOrdered: { type: boolean }
        sortOrder: { type: integer }

    MenuItemWithModifiers:
      allOf:
        - $ref: "#/components/schemas/MenuItemSummary"
        - type: object
          required: [modifierGroups]
          additionalProperties: false
          properties:
            modifierGroups:
              type: array
              items:
                $ref: "#/components/schemas/MenuModifierGroup"

    MenuItemDetail:
      allOf:
        - $ref: "#/components/schemas/MenuItemWithModifiers"
        - type: object
          required: [categoryId, categorySlug]
          additionalProperties: false
          properties:
            categoryId: { type: string }
            categorySlug: { type: string }

    MenuCategory:
      type: object
      required: [id, slug, name, description, sortOrder, items]
      additionalProperties: false
      properties:
        id: { type: string }
        slug: { type: string, example: whole-dinners }
        name: { type: string, example: Whole Dinners }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemWithModifiers"

    FullMenu:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MenuCategory"

    CategorySummary:
      type: object
      required: [id, slug, name, description, sortOrder, activeItemCount]
      additionalProperties: false
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }
        activeItemCount: { type: integer }

    CategoriesPayload:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"

    CuratedItemsPayload:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemSummary"

    StoreHoursRow:
      type: object
      required: [dayOfWeek, openTime, closeTime, isClosed]
      additionalProperties: false
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday
        openTime: { type: string, nullable: true, example: "10:30" }
        closeTime: { type: string, nullable: true, example: "23:00" }
        isClosed: { type: boolean }

    StoreClosureRow:
      type: object
      required: [date, reason]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        reason: { type: string, nullable: true }

    StoreStatus:
      type: object
      required:
        - storeName
        - addressLine1
        - addressLine2
        - city
        - state
        - postalCode
        - contactPhone
        - timezone
        - hours
        - closures
        - isOpen
        - nextOpenAt
        - acceptingOrders
        - notAcceptingMessage
        - prepMinutes
        - estimatedReadyAt
        - taxRateBps
        - taxAppliedPreDiscount
        - tippingEnabled
        - tipPresetsBps
        - defaultTipPresetIndex
      additionalProperties: false
      properties:
        storeName: { type: string, example: Harold's Chicken Oak Lawn }
        addressLine1: { type: string }
        addressLine2: { type: string, nullable: true }
        city: { type: string, example: Oak Lawn }
        state: { type: string, example: IL }
        postalCode: { type: string }
        contactPhone: { type: string }
        timezone: { type: string, example: America/Chicago }
        hours:
          type: array
          items:
            $ref: "#/components/schemas/StoreHoursRow"
        closures:
          type: array
          items:
            $ref: "#/components/schemas/StoreClosureRow"
        isOpen: { type: boolean }
        nextOpenAt: { type: string, format: date-time, nullable: true }
        acceptingOrders: { type: boolean }
        notAcceptingMessage: { type: string, nullable: true }
        prepMinutes: { type: integer, example: 20 }
        estimatedReadyAt: { type: string, format: date-time }
        taxRateBps: { type: integer, example: 1010, description: 10.10% → 1010 bps }
        taxAppliedPreDiscount: { type: boolean }
        tippingEnabled: { type: boolean }
        tipPresetsBps:
          type: array
          items: { type: integer }
          example: [1500, 1800, 2000, 2500]
        defaultTipPresetIndex: { type: integer }

    FullMenuSuccess:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/FullMenu"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    CategoriesSuccess:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/CategoriesPayload"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    MenuItemDetailSuccess:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/MenuItemDetail"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    CuratedItemsSuccess:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/CuratedItemsPayload"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    StoreStatusSuccess:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/StoreStatus"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    # —— Sprint 3: cart / quote ——
    CartValidationReasonCode:
      type: string
      description: |
        Machine-readable cart validation reason. Availability-class codes
        (`ITEM_SOLD_OUT`, `OPTION_SOLD_OUT`, `OPTION_INACTIVE`, `GROUP_INACTIVE`,
        `ITEM_NOT_FOUND`) should be presented differently from customer-fixable
        selection mistakes.
      enum:
        - EMPTY_CART
        - TOO_MANY_LINES
        - INVALID_QUANTITY
        - TOO_MANY_ITEMS
        - NOTE_TOO_LONG
        - TIP_OUT_OF_RANGE
        - TIP_DISABLED
        - TIP_PRESET_INVALID
        - PRICE_FIELD_FORBIDDEN
        - MALFORMED_BODY
        - ITEM_NOT_FOUND
        - ITEM_SOLD_OUT
        - OPTION_NOT_FOUND
        - OPTION_INACTIVE
        - OPTION_SOLD_OUT
        - OPTION_NOT_BOUND
        - GROUP_INACTIVE
        - DUPLICATE_OPTION
        - BELOW_MIN_SELECT
        - ABOVE_MAX_SELECT

    CartValidationReason:
      type: object
      required: [code, message, lineIndex, itemId, groupId, optionId, isAvailability]
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/CartValidationReasonCode"
        message: { type: string }
        lineIndex: { type: integer, nullable: true }
        itemId: { type: string, nullable: true }
        groupId: { type: string, nullable: true }
        optionId: { type: string, nullable: true }
        isAvailability:
          type: boolean
          description: true when availability changed underneath the customer

    TipRequest:
      description: Exactly one of preset / rate / amount. Omit tip for absent; amountCents 0 is explicit decline.
      oneOf:
        - type: object
          required: [type, presetIndex]
          additionalProperties: false
          properties:
            type: { type: string, enum: [preset] }
            presetIndex: { type: integer, minimum: 0 }
        - type: object
          required: [type, rateBps]
          additionalProperties: false
          properties:
            type: { type: string, enum: [rate] }
            rateBps: { type: integer, minimum: 0 }
        - type: object
          required: [type, amountCents]
          additionalProperties: false
          properties:
            type: { type: string, enum: [amount] }
            amountCents: { type: integer, minimum: 0 }

    CartLineRequest:
      type: object
      required: [itemId, quantity, selectedOptionIds]
      additionalProperties: false
      properties:
        itemId: { type: string }
        quantity: { type: integer, minimum: 1 }
        selectedOptionIds:
          type: array
          items: { type: string }
        customerNote: { type: string, nullable: true }

    CartRequest:
      type: object
      required: [lines]
      additionalProperties: false
      description: Identifiers and quantities only — never prices, names, or totals.
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CartLineRequest"
        tip:
          $ref: "#/components/schemas/TipRequest"

    SelectedModifierSnapshot:
      type: object
      required: [groupName, groupPrompt, optionName, priceDeltaCents]
      additionalProperties: false
      properties:
        groupName: { type: string }
        groupPrompt: { type: string }
        optionName: { type: string }
        priceDeltaCents: { type: integer }

    PricedLineSnapshot:
      type: object
      required:
        - itemName
        - boardLabel
        - baseUnitPriceCents
        - modifierTotalCents
        - effectiveUnitPriceCents
        - quantity
        - lineTotalCents
        - selectedModifiers
        - customerNote
      additionalProperties: false
      properties:
        itemName: { type: string }
        boardLabel: { type: string, nullable: true }
        baseUnitPriceCents: { type: integer }
        modifierTotalCents: { type: integer }
        effectiveUnitPriceCents: { type: integer }
        quantity: { type: integer }
        lineTotalCents: { type: integer }
        selectedModifiers:
          type: array
          items:
            $ref: "#/components/schemas/SelectedModifierSnapshot"
        customerNote: { type: string, nullable: true }

    PricedLine:
      type: object
      required: [itemId, snapshot]
      additionalProperties: false
      properties:
        itemId: { type: string }
        snapshot:
          $ref: "#/components/schemas/PricedLineSnapshot"

    TipApplied:
      oneOf:
        - type: object
          required: [type, tipCents]
          additionalProperties: false
          properties:
            type: { type: string, enum: [none] }
            tipCents: { type: integer, enum: [0] }
        - type: object
          required: [type, presetIndex, rateBps, tipCents]
          additionalProperties: false
          properties:
            type: { type: string, enum: [preset] }
            presetIndex: { type: integer }
            rateBps: { type: integer }
            tipCents: { type: integer }
        - type: object
          required: [type, rateBps, tipCents]
          additionalProperties: false
          properties:
            type: { type: string, enum: [rate] }
            rateBps: { type: integer }
            tipCents: { type: integer }
        - type: object
          required: [type, tipCents]
          additionalProperties: false
          properties:
            type: { type: string, enum: [amount] }
            tipCents: { type: integer }

    QuoteResult:
      type: object
      required:
        - lines
        - subtotalCents
        - taxCents
        - taxRateBps
        - taxAppliedPreDiscount
        - tip
        - totalCents
        - orderable
        - blockingReasons
        - estimatedReadyAt
      additionalProperties: false
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PricedLine"
        subtotalCents: { type: integer }
        taxCents: { type: integer }
        taxRateBps: { type: integer }
        taxAppliedPreDiscount: { type: boolean }
        tip:
          $ref: "#/components/schemas/TipApplied"
        totalCents: { type: integer }
        orderable: { type: boolean }
        blockingReasons:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorCode"
        estimatedReadyAt: { type: string, format: date-time }

    QuoteSuccess:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/QuoteResult"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    QuoteValidationError:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, details]
          additionalProperties: false
          properties:
            code: { type: string, enum: [VALIDATION_ERROR] }
            message: { type: string }
            details:
              type: object
              required: [reasons]
              additionalProperties: false
              properties:
                reasons:
                  type: array
                  items:
                    $ref: "#/components/schemas/CartValidationReason"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    CreateOrderRequest:
      type: object
      required: [cart, customer, paymentToken, idempotencyKey]
      additionalProperties: false
      properties:
        cart:
          $ref: '#/components/schemas/CartRequest'
        customer:
          type: object
          required: [firstName, lastName, phone, email, smsConsent]
          properties:
            firstName: { type: string }
            lastName: { type: string }
            phone: { type: string }
            email: { type: string }
            smsConsent: { type: boolean }
        paymentToken: { type: string }
        idempotencyKey: { type: string }
        customerNote: { type: string, nullable: true }
